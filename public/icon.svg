<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>
  
  <!-- Outer card frame -->
  <rect x="56" y="56" width="400" height="400" rx="36" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  
  <!-- Question indicator bar -->
  <rect x="88" y="88" width="336" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="256" y="120" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="2">MCQ ANSWER PAD</text>
  
  <!-- Choice buttons preview: A, B (selected), C, D -->
  <rect x="88" y="160" width="336" height="56" rx="16" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <text x="130" y="198" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="900">A</text>
  
  <rect x="88" y="232" width="336" height="56" rx="16" fill="url(#btnGrad)" stroke="#60a5fa" stroke-width="3"/>
  <text x="130" y="270" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="900">B</text>
  <circle cx="380" cy="260" r="14" fill="#60a5fa"/>
  <path d="M373 260 L378 265 L387 254" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <rect x="88" y="304" width="336" height="56" rx="16" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <text x="130" y="342" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="900">C</text>
  
  <rect x="88" y="376" width="336" height="56" rx="16" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <text x="130" y="414" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="900">D</text>
</svg>
